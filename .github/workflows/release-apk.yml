# CD: when you push a version tag (for example v0.1.0), build the Android APK
# and attach it to a GitHub Release that evaluators can download.
name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create platform folders if missing
        run: |
          if [ ! -d android ]; then flutter create --platforms=android,web --project-name qissago --org com.qissago .; fi
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_URL=${{ vars.PROD_API_URL }}
      - uses: softprops/action-gh-release@v2
        with:
          files: frontend/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
