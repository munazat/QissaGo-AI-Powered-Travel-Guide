version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: pub
    directory: /frontend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: google_fonts
        versions: [">=9.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
