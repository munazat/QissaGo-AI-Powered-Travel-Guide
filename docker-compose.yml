# Local PostgreSQL for development.
#   Start:  docker compose up -d db
#   Stop:   docker compose stop db
# Data is kept in the "pgdata" volume between restarts.
services:
  db:
    image: postgres:16
    container_name: qissago-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: qissago
      POSTGRES_PASSWORD: qissago
      POSTGRES_DB: qissago
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/create_test_db.sql:/docker-entrypoint-initdb.d/create_test_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qissago"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
